paper:
  slug: spadnet-structure-prior-aware-dynamic-network-for-face-super-resolution
  title: SPADNet Structure Prior-Aware Dynamic Network for Face Super-Resolution
source_code:
  url: https://github.com/wcy-cs/SPADNet
  commit: 2f185eb3a8b81aa30957b41e8b49b2b5de86bde4
  license: unspecified (PacConv submodule CC BY-NC-SA 4.0)
data:
  dataset: celeba
  root: ../../datasets/celeba/extracted/celeba
  helen_root: ../../datasets/helen
  max_train_samples: 512
  max_val_samples: 64
  max_test_samples: 128
  augment: false
  augment_helen: true
model:
  name: spadnet
  scale: 8
  img_size: 128
  n_feats: 64
  number: 6
  hab_num: 5
train:
  protocol: smoke
  epochs: 2
  batch_size: 4
  lr: 0.0001
  beta1: 0.9
  beta2: 0.999
  optimizer: adam
  lr_decay_epochs: 10
  lr_decay_steps: 5
  seed: 42
  num_workers: 4
  log_every: 10
  max_steps: 40
eval:
  batch_size: 4
  metric: psnr_ssim_y
paths:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  pred_dir: outputs/predictions
  figure_dir: outputs/figures
report:
  title: SPADNet Results Report
  embed_format: svg
device: cuda
cuda_device: 0
